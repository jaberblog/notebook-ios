name: Build IPA

# با هر push روی main یا اجرای دستی، یک فایل IPA می‌سازد.
# این ورک‌فلو بدون حساب دولوپر اپل هم کار می‌کند و یک IPA بدون امضا
# (unsigned) تولید می‌کند. برای نصب آن روی آیفون واقعی، بخش «نصب»
# در README.md را بخوانید.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project EvelynNotebook.xcodeproj \
            -scheme EvelynNotebook \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/EvelynNotebook.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/EvelynNotebook.xcarchive/Products/Applications/EvelynNotebook.app Payload/
          zip -r EvelynNotebook.ipa Payload
          ls -lh EvelynNotebook.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EvelynNotebook-ipa
          path: EvelynNotebook.ipa
          if-no-files-found: error
